# CartRenew — Public distribution app (App Store listing enabled)
# Learn more: https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "b0d8dbf013b051fc9ba20c1c5df304ca"
name = "CartRenew Public"
# Embedded console entry inside Shopify Admin (App Bridge).
application_url = "https://www.cartrenew.com/shopify"
embedded = true

[webhooks]
api_version = "2026-07"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "/api/webhooks/compliance"

[access_scopes]
scopes = "read_checkouts,read_orders,write_orders"

[auth]
redirect_urls = [
  "https://www.cartrenew.com/api/auth/shopify/callback",
  "https://www.cartrenew.com/api/shopify/callback"
]

[build]
automatically_update_urls_on_dev = true
