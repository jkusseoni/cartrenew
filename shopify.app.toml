# Shopify app configuration consumed by the Shopify CLI.
# Docs: https://shopify.dev/docs/apps/tools/cli/configuration
name = "CartRenew"
client_id = "d0ac869a78129eb4f715276aa28916cb"

# Embedded app rendered inside the Shopify Admin iframe via App Bridge.
# During `shopify app dev` the CLI overrides the application_url host with the
# live tunnel hostname. Points at the Shopify console (not the marketing page).
application_url = "https://cartrenew.com/shopify"
embedded = true

[access_scopes]
# Scopes requested by lib/shopify/config.ts (read_orders, write_orders, read_checkouts).
scopes = "read_orders,write_orders,read_checkouts"

[auth]
redirect_urls = [
  "https://cartrenew.com/api/auth/shopify/callback",
  "https://cartrenew.com/api/shopify/callback"
]

[webhooks]
api_version = "2024-10"

[pos]
embedded = false
