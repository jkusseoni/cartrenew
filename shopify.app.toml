# Default Shopify CLI config — synced with shopify.app.cartrenew-public.toml (Public app)
# Docs: https://shopify.dev/docs/apps/tools/cli/configuration
#
# Iframe-based App Home: merchants open CartRenew Public in Shopify Admin and load
# the embedded console at application_url (no App Home UI extension).

name = "CartRenew Public"
client_id = "b0d8dbf013b051fc9ba20c1c5df304ca"
application_url = "https://www.cartrenew.com/shopify"
embedded = true

[access_scopes]
scopes = "read_checkouts,read_orders,write_orders"

[auth]
redirect_urls = [
  "https://www.cartrenew.com/api/auth/shopify/callback",
  "https://www.cartrenew.com/api/shopify/callback",
  "https://www.cartrenew.com/api/shopify/billing/callback"
]

[webhooks]
api_version = "2026-07"

# HTTP delivery (not Google Pub/Sub / EventBridge).
# Shopify selects the delivery method from the URI scheme:
#   - https://… or /relative/path  → HTTP
#   - pubsub://project:topic       → Google Pub/Sub  (do not use)
#   - arn:aws:events:…             → Amazon EventBridge (do not use)
# There is no separate delivery_method field in shopify.app.toml.

# Abandoned checkout + cart + order lifecycle → Vercel HTTP handler
[[webhooks.subscriptions]]
topics = [
  "checkouts/create",
  "checkouts/update",
  "carts/create",
  "carts/update",
  "orders/create",
  "orders/paid",
  "app/uninstalled",
  "app_subscriptions/update"
]
uri = "https://www.cartrenew.com/api/webhooks/shopify"

# Mandatory compliance topics (HTTP)
[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "https://www.cartrenew.com/api/webhooks"

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = true
