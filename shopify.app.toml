# Default Shopify CLI config — synced with shopify.app.cartrenew-public.toml (Public app)
# Docs: https://shopify.dev/docs/apps/tools/cli/configuration

name = "CartRenew Public"
client_id = "b0d8dbf013b051fc9ba20c1c5df304ca"
application_url = "https://www.cartrenew.com/shopify"
embedded = true

[access_scopes]
scopes = "read_checkouts,read_orders,write_orders"

[auth]
redirect_urls = [
  "https://www.cartrenew.com/api/auth/shopify/callback",
  "https://www.cartrenew.com/api/shopify/callback"
]

[webhooks]
api_version = "2026-07"

# application_url includes /shopify, so Shopify delivers compliance webhooks to:
#   https://www.cartrenew.com/shopify/api/webhooks
#   https://www.cartrenew.com/shopify/api/webhooks/customers/data_request
#   https://www.cartrenew.com/shopify/api/webhooks/customers/redact
#   https://www.cartrenew.com/shopify/api/webhooks/shop/redact
[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "/api/webhooks"

[pos]
embedded = false

[build]
automatically_update_urls_on_dev = true
