# CartRenew Public — Shopify app configuration
# Docs: https://shopify.dev/docs/apps/tools/cli/configuration
#
# NOTE: This is the ONLY config file for this app.
# Do not keep shopify.app.<name>.toml variants alongside it — multiple
# config files are what caused the duplicate-app confusion.

name = "CartRenew Public"
client_id = "b0d8dbf013b051fc9ba20c1c5df304ca"
application_url = "https://www.cartrenew.com/app"
embedded = true

[access_scopes]
scopes = "read_checkouts,read_orders,write_orders"

[auth]
redirect_urls = [
  "https://www.cartrenew.com/api/auth/shopify/callback",
  "https://www.cartrenew.com/api/shopify/billing/callback"
]

[webhooks]
api_version = "2026-07"

# HTTP delivery. Shopify picks the delivery method from the URI scheme:
#   https://…            -> HTTP
#   pubsub://project:top -> Google Pub/Sub      (not used)
#   arn:aws:events:…     -> Amazon EventBridge  (not used)

# Cart / checkout / order lifecycle
[[webhooks.subscriptions]]
topics = [
  "checkouts/create",
  "checkouts/update",
  "carts/create",
  "carts/update",
  "orders/create",
  "orders/paid",
  "app/uninstalled",
  "app_subscriptions/update"
]
uri = "https://www.cartrenew.com/api/webhooks/shopify"

# Mandatory GDPR / compliance topics
[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request", "customers/redact", "shop/redact"]
uri = "https://www.cartrenew.com/api/webhooks"

[pos]
embedded = false

[build]
# MUST stay false.
# When true, `shopify app dev` overwrites application_url and redirect_urls
# with the temporary tunnel URL and pushes that to Shopify — which breaks
# the embedded app checks every time you run dev.
automatically_update_urls_on_dev = false